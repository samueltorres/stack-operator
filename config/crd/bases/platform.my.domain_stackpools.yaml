---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: stackpools.platform.my.domain
spec:
  group: platform.my.domain
  names:
    kind: StackPool
    listKind: StackPoolList
    plural: stackpools
    singular: stackpool
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.warm
      name: Warm
      type: integer
    - jsonPath: .status.provisioning
      name: Provisioning
      type: integer
    - jsonPath: .status.claimed
      name: Claimed
      type: integer
    - jsonPath: .status.pendingClaims
      name: Pending
      type: integer
    - jsonPath: .spec.max
      name: Max
      type: integer
    - jsonPath: .status.conditions[?(@.type=='Degraded')].status
      name: Degraded
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          StackPool keeps a set of identical Stacks provisioned ahead of time so that
          StackClaims can be served without waiting for provisioning.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of StackPool
            properties:
              defaultTTL:
                default: 2h
                description: |-
                  defaultTTL is how long a claim holds its Stack when the claim does not
                  set a ttl. The clock starts when the claim is bound.
                type: string
                x-kubernetes-validations:
                - message: defaultTTL must be positive
                  rule: duration(self) > duration('0s')
              max:
                description: |-
                  max caps the number of Stacks the pool runs at once: warm, provisioning
                  and claimed. Stacks being torn down do not count.
                format: int32
                minimum: 1
                type: integer
              maxTTL:
                description: |-
                  maxTTL caps the ttl a claim may hold its Stack for. Longer requests are
                  clamped. When unset, claims may ask for any ttl.
                type: string
                x-kubernetes-validations:
                - message: maxTTL must be positive
                  rule: duration(self) > duration('0s')
              template:
                description: |-
                  template describes the Stacks the pool creates. Every Stack in a pool is
                  built from the same template. Changing it replaces unclaimed Stacks;
                  claimed Stacks are left alone.
                properties:
                  metadata:
                    description: metadata holds labels and annotations copied onto
                      every Stack.
                    properties:
                      annotations:
                        additionalProperties:
                          type: string
                        description: annotations copied onto every Stack.
                        type: object
                      labels:
                        additionalProperties:
                          type: string
                        description: labels copied onto every Stack.
                        type: object
                    type: object
                  spec:
                    description: spec is copied onto every Stack.
                    properties:
                      claimRef:
                        description: |-
                          claimRef binds the Stack to the StackClaim that holds it. It is set by the
                          StackPool controller and cannot be changed or removed once set.
                        properties:
                          name:
                            description: name of the StackClaim.
                            minLength: 1
                            type: string
                          uid:
                            description: |-
                              uid of the StackClaim, so that a recreated claim with the same name is
                              never mistaken for the original one.
                            minLength: 1
                            type: string
                        required:
                        - name
                        - uid
                        type: object
                        x-kubernetes-map-type: atomic
                      expiresAt:
                        description: |-
                          expiresAt is the time after which the Stack is deleted and its
                          infrastructure torn down. A Stack without expiresAt never expires.
                          For Stacks bound to a StackClaim this is managed by the claim.
                        format: date-time
                        type: string
                      foo:
                        description: foo is an example field of Stack. Edit stack_types.go
                          to remove/update
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: expiresAt and claimRef are managed by the pool and
                        cannot be templated
                      rule: '!has(self.expiresAt) && !has(self.claimRef)'
                type: object
              warm:
                description: |-
                  warm is the number of unclaimed Stacks, ready or provisioning, the pool
                  keeps around so claims can be served without waiting for provisioning.
                  Set it to 0 for a purely on-demand pool.
                format: int32
                minimum: 0
                type: integer
            required:
            - max
            - template
            - warm
            type: object
            x-kubernetes-validations:
            - message: warm must not exceed max
              rule: self.warm <= self.max
            - message: defaultTTL must not exceed maxTTL
              rule: '!has(self.maxTTL) || duration(self.defaultTTL) <= duration(self.maxTTL)'
          status:
            description: status defines the observed state of StackPool
            properties:
              claimed:
                description: claimed is the number of Stacks bound to a StackClaim.
                format: int32
                type: integer
              conditions:
                description: |-
                  conditions represent the current state of the StackPool resource.

                  - Ready: the pool holds its desired number of warm Stacks.
                  - Degraded: provisioning stopped after repeated failures. Change the
                    template (for example by bumping an annotation) to try again.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              consecutiveFailures:
                description: |-
                  consecutiveFailures counts Stacks built from the current template that
                  failed to provision since the last one that succeeded.
                format: int32
                type: integer
              lastFailureTime:
                description: |-
                  lastFailureTime is when the most recent provisioning failure was observed.
                  Provisioning backs off exponentially from this point.
                format: date-time
                type: string
              observedGeneration:
                description: observedGeneration is the generation of the spec this
                  status reflects.
                format: int64
                type: integer
              pendingClaims:
                description: pendingClaims is the number of StackClaims waiting for
                  a Stack.
                format: int32
                type: integer
              provisioning:
                description: provisioning is the number of unclaimed Stacks still
                  being provisioned.
                format: int32
                type: integer
              templateHash:
                description: |-
                  templateHash identifies the current template. Stacks carrying a
                  different hash are replaced once they are unclaimed.
                type: string
              warm:
                description: warm is the number of unclaimed, ready Stacks waiting
                  for a claim.
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
