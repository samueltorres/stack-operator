---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: stacks.platform.my.domain
spec:
  group: platform.my.domain
  names:
    kind: Stack
    listKind: StackList
    plural: stacks
    singular: stack
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      type: string
    - jsonPath: .metadata.labels.platform\.my\.domain/pool
      name: Pool
      type: string
    - jsonPath: .spec.claimRef.name
      name: Claim
      type: string
    - jsonPath: .spec.expiresAt
      name: Expires
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: Stack is the Schema for the stacks API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Stack
            properties:
              claimRef:
                description: |-
                  claimRef binds the Stack to the StackClaim that holds it. It is set by the
                  StackPool controller and cannot be changed or removed once set.
                properties:
                  name:
                    description: name of the StackClaim.
                    minLength: 1
                    type: string
                  uid:
                    description: |-
                      uid of the StackClaim, so that a recreated claim with the same name is
                      never mistaken for the original one.
                    minLength: 1
                    type: string
                required:
                - name
                - uid
                type: object
                x-kubernetes-map-type: atomic
              expiresAt:
                description: |-
                  expiresAt is the time after which the Stack is deleted and its
                  infrastructure torn down. A Stack without expiresAt never expires.
                  For Stacks bound to a StackClaim this is managed by the claim.
                format: date-time
                type: string
              foo:
                description: foo is an example field of Stack. Edit stack_types.go
                  to remove/update
                type: string
            type: object
            x-kubernetes-validations:
            - message: claimRef is immutable once set
              rule: '!has(oldSelf.claimRef) || (has(self.claimRef) && self.claimRef
                == oldSelf.claimRef)'
          status:
            description: status defines the observed state of Stack
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the Stack resource.

                  The Ready condition is the contract with consumers of Stacks:
                  - Ready=True: the infrastructure is usable.
                  - Ready=False, reason=Provisioning: the infrastructure is being created.
                  - Ready=False, reason=Failed: provisioning failed and will not be retried.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
